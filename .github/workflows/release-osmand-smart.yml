name: Release OsmAnd Smart APK
run-name: "5.4.0#smart${{ github.event.workflow_run.run_number }}.${{ github.event.workflow_run.run_attempt }} — Release OsmAnd Smart APK"

on:
  workflow_run:
    workflows:
      - Build OsmAnd Smart APK
    types:
      - completed

permissions:
  actions: write
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: osmand-smart-android-full-opengl-arm64-debug
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          shopt -s globstar nullglob
          apks=(release/**/*.apk)

          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one APK, found ${#apks[@]}" >&2
            exit 1
          fi

          printf 'path=%s\n' "${apks[0]}" >> "${GITHUB_OUTPUT}"

      - name: Create public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: smart-build-${{ github.event.workflow_run.run_number }}-${{ github.event.workflow_run.run_attempt }}
          RELEASE_TITLE: OsmAnd Smart OpenGL build #${{ github.event.workflow_run.run_number }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          gh release create "${RELEASE_TAG}" "${APK_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes "Debug ARM64 OpenGL CPU build for testing. Application ID: com.tovam.osmandsmart. Signed with the repository's stable test key, with a monotonically increasing versionCode so later APKs install as updates." \
            --prerelease

      - name: Delete temporary Actions artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          artifact_ids_file="${RUNNER_TEMP}/osmand-smart-artifact-ids.txt"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "osmand-smart-android-full-opengl-arm64-debug") | .id' \
            > "${artifact_ids_file}"

          mapfile -t artifact_ids < "${artifact_ids_file}"
          if (( ${#artifact_ids[@]} != 1 )); then
            echo "Expected exactly one temporary APK artifact, found ${#artifact_ids[@]}" >&2
            exit 1
          fi

          artifact_id="${artifact_ids[0]}"
          if [[ ! "${artifact_id}" =~ ^[0-9]+$ ]]; then
            echo "Refusing to delete an invalid artifact id" >&2
            exit 1
          fi

          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
