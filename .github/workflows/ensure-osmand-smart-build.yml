name: Recover missing OsmAnd builds

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: recover-osmand-smart-build
  cancel-in-progress: false

jobs:
  ensure:
    if: github.repository == 'tovam/OsmAnd'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Test build recovery rules
        run: node --test .github/scripts/ensure-smart-build.test.cjs
      - name: Recover a pushed application revision without a build
        uses: actions/github-script@v8
        with:
          script: |
            const ensure = require('./.github/scripts/ensure-smart-build.cjs');
            await ensure({github, context, core});
