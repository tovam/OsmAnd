name: Build OsmAnd Smart APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-osmand-smart.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OsmAnd fork
        uses: actions/checkout@v7
        with:
          path: android

      - name: Checkout OsmAnd resources
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-resources
          path: resources

      - name: Checkout OsmAnd core
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-core
          path: core

      - name: Checkout OsmAnd legacy core
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-core-legacy
          path: core-legacy

      - name: Checkout OsmAnd build scripts
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-build
          path: build

      - name: Checkout OsmAnd tools
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-tools
          path: tools

      - name: Checkout OsmAnd miscellaneous files
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-misc
          path: misc

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: "11"
          distribution: adopt

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Patch memory requirements
        working-directory: android
        run: printf '\norg.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8\n' >> gradle.properties

      - name: Show available disk space
        run: df -h

      - name: Build Android Full ARM64 debug APK
        working-directory: android
        run: ./gradlew assembleAndroidFullLegacyArm64Debug

      - name: Show remaining disk space
        if: always()
        run: df -h

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: osmand-smart-android-full-arm64-debug
          path: android/OsmAnd/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 90
