name: Build OsmAnd Smart APK
run-name: "5.4.0#smart${{ github.run_number }}.${{ github.run_attempt }} — Build OsmAnd Smart APK"
# Manual rebuild requested: 2026-09-15 13:28:19 UTC. Application sources are unchanged.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/build-osmand-smart.yml
      - OsmAnd/**
      - OsmAnd-java/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OsmAnd fork
        uses: actions/checkout@v7
        with:
          path: android

      - name: Checkout OsmAnd resources
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-resources
          path: resources

      - name: Checkout OsmAnd core
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-core
          path: core

      - name: Checkout OsmAnd legacy core
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-core-legacy
          path: core-legacy

      - name: Checkout OsmAnd build scripts
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-build
          path: build

      - name: Checkout OsmAnd tools
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-tools
          path: tools

      - name: Checkout OsmAnd miscellaneous files
        uses: actions/checkout@v7
        with:
          repository: osmandapp/OsmAnd-misc
          path: misc

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: adopt
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Apply flight altitude and volumetric geometry to OsmAnd core
        run: |
          git -C core apply --check ../android/OsmAnd/patches/osmand-core/model3d-marker-elevation.patch
          git -C core apply ../android/OsmAnd/patches/osmand-core/model3d-marker-elevation.patch
          git -C core apply --check ../android/OsmAnd/patches/osmand-core/flight-volumetric-geometry.patch
          git -C core apply ../android/OsmAnd/patches/osmand-core/flight-volumetric-geometry.patch
          cp android/OsmAnd/patches/osmand-core/FlightTubeMesh.h core/src/Map/
          cp android/OsmAnd/patches/osmand-core/FlightVectorLineBridge.cpp core/wrappers/java/

      - name: Validate patched JNI CMake syntax
        run: |
          cmake -DWRAPPER_FILE="${GITHUB_WORKSPACE}/core/wrappers/java/CMakeLists.txt" \
            -P android/OsmAnd/test/native/CheckFlightJniCmake.cmake

      - name: Test flight tube geometry
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            android/OsmAnd/test/native/FlightTubeMeshTest.cpp -o "${RUNNER_TEMP}/flight-tube-test"
          "${RUNNER_TEMP}/flight-tube-test"

      - name: Test photo landmarks, pose solver and dehazing
        run: |
          mkdir -p "${RUNNER_TEMP}/flight-photo-tests"
          javac --release 8 -d "${RUNNER_TEMP}/flight-photo-tests" \
            android/OsmAnd-java/src/main/java/net/osmand/util/PhotoCalibrationInput.java \
            android/OsmAnd-java/src/main/java/net/osmand/util/PhotoLandmarkGeometry.java \
            android/OsmAnd-java/src/main/java/net/osmand/util/PhotoPoseSolver.java \
            android/OsmAnd-java/src/main/java/net/osmand/util/PhotoPoseDiagnostics.java \
            android/OsmAnd-java/src/main/java/net/osmand/util/PhotoDehaze.java \
            android/OsmAnd-java/src/main/java/net/osmand/util/PhotoPlaneGeometry.java \
            android/OsmAnd/test/standalone/PhotoCalibrationInputTest.java \
            android/OsmAnd/test/standalone/PhotoLandmarkGeometryTest.java \
            android/OsmAnd/test/standalone/PhotoPoseSolverTest.java \
            android/OsmAnd/test/standalone/PhotoPoseDiagnosticsTest.java \
            android/OsmAnd/test/standalone/PhotoDehazeTest.java \
            android/OsmAnd/test/standalone/PhotoPlaneGeometryTest.java
          java -cp "${RUNNER_TEMP}/flight-photo-tests" PhotoCalibrationInputTest
          java -cp "${RUNNER_TEMP}/flight-photo-tests" PhotoLandmarkGeometryTest
          java -cp "${RUNNER_TEMP}/flight-photo-tests" PhotoPoseSolverTest
          java -cp "${RUNNER_TEMP}/flight-photo-tests" PhotoPoseDiagnosticsTest
          java -cp "${RUNNER_TEMP}/flight-photo-tests" PhotoDehazeTest
          java -cp "${RUNNER_TEMP}/flight-photo-tests" PhotoPlaneGeometryTest

      - name: Resolve patched core cache identity
        # Keep the native cache separate from the inexpensive JVM checks below.
        id: patched-core-identity
        run: |
          echo "core_sha=$(git -C core rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "build_sha=$(git -C build rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          ndk_path="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-unknown}}"
          echo "ndk_revision=$(basename "${ndk_path}")" >> "${GITHUB_OUTPUT}"

      - name: Restore stripped patched OsmAnd core
        id: patched-core-cache
        uses: actions/cache@v5
        with:
          path: binaries/android/clang-arm64-v8a/Debug/libOsmAndCoreWithJNI.so
          key: patched-osmand-core-arm64-debug-stripped-v2-${{ runner.os }}-api35-${{ steps.patched-core-identity.outputs.ndk_revision }}-${{ steps.patched-core-identity.outputs.core_sha }}-${{ steps.patched-core-identity.outputs.build_sha }}-${{ hashFiles('android/OsmAnd/patches/osmand-core/*.patch', 'android/OsmAnd/patches/osmand-core/*.h', 'android/OsmAnd/patches/osmand-core/*.cpp') }}

      - name: Build and strip patched OsmAnd core for ARM64
        if: steps.patched-core-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          export ANDROID_SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          export ANDROID_NDK="${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}}"
          export ANDROID_API_VERSION=android-35
          export ANDROID_SDK_BUILD_TOOLS_REVISION=35.0.0
          export OSMAND_BUILD_CPU_CORES_NUM=4
          test -d "${ANDROID_SDK}"
          test -d "${ANDROID_NDK}"
          bash build/arm64-v8a-android-clang.sh debug 2>&1 | tee "${RUNNER_TEMP}/osmand-core-build.log"
          cmake --build baked/arm64-v8a-android-clang-debug.make --target OsmAndCoreWithJNI --parallel 4 2>&1 | tee -a "${RUNNER_TEMP}/osmand-core-build.log"
          core_library="binaries/android/clang-arm64-v8a/Debug/libOsmAndCoreWithJNI.so"
          strip_tool="${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          test -s "${core_library}"
          test -x "${strip_tool}"
          size_before="$(stat -c '%s' "${core_library}")"
          "${strip_tool}" --strip-unneeded "${core_library}"
          size_after="$(stat -c '%s' "${core_library}")"
          test "${size_after}" -gt 0
          echo "OsmAndCore ARM64: ${size_before} bytes before strip, ${size_after} bytes after strip" >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate patched OsmAnd core input
        run: |
          test -s binaries/android/clang-arm64-v8a/Debug/libOsmAndCoreWithJNI.so
          ndk_path="${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}}"
          "${ndk_path}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" --dynamic --defined-only \
            binaries/android/clang-arm64-v8a/Debug/libOsmAndCoreWithJNI.so \
            | grep 'Java_net_osmand_core_jni_FlightVectorLineBridge_enableTubeNative'

      - name: Publish OsmAnd core failure details
        if: failure()
        run: |
          if [ ! -f "${RUNNER_TEMP}/osmand-core-build.log" ]; then
            exit 0
          fi
          details="$(
            grep -nEi -C 3 '(fatal error|error:|no space left|killed|failed|not found|cannot|CMake Error|make(\[[0-9]+\])?: \*\*\*)' "${RUNNER_TEMP}/osmand-core-build.log" | tail -n 70 | cut -c1-500 || true
            echo '--- final lines ---'
            tail -n 12 "${RUNNER_TEMP}/osmand-core-build.log" | cut -c1-500
          )"
          details="${details//'%'/'%25'}"
          details="${details//$'\r'/'%0D'}"
          details="${details//$'\n'/'%0A'}"
          echo "::error title=OsmAnd core build failed::${details}"

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Patch memory requirements
        working-directory: android
        run: printf '\norg.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8\n' >> gradle.properties

      - name: Show available disk space
        run: df -h

      - name: Build Android Full OpenGL ARM64 debug APK
        working-directory: android
        run: |
          set -o pipefail
          export APK_NUMBER_VERSION=$((6000000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          export APK_VERSION_SUFFIX="#smart${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "Building update-compatible versionCode ${APK_NUMBER_VERSION}"
          ./gradlew --build-cache -PusePatchedOsmAndCoreNative=true assembleAndroidFullOpenglArm64Debug 2>&1 | tee "${RUNNER_TEMP}/gradle-build.log"

      - name: Test flight logic, cloud archives and server
        working-directory: android
        run: |
          mkdir -p .flight-test-tools
          curl --fail --silent --show-error https://repo.maven.apache.org/maven2/com/facebook/ktfmt/0.54/ktfmt-0.54-jar-with-dependencies.jar -o .flight-test-tools/ktfmt.jar
          curl --fail --silent --show-error https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o .flight-test-tools/json.jar
          curl --fail --silent --show-error https://repo.maven.apache.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.8.1/kotlinx-coroutines-core-jvm-1.8.1.jar -o .flight-test-tools/coroutines.jar
          curl --fail --silent --show-error https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o .flight-test-tools/junit.jar
          curl --fail --silent --show-error https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o .flight-test-tools/hamcrest.jar
          bash OsmAnd/test/standalone/check-flight-preparation.sh .flight-test-tools
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s server/flight_cloud -p 'test_*.py'

      - name: Verify patched native core is packaged
        run: |
          apk_path="$(find android/OsmAnd/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "${apk_path}"
          unzip -p "${apk_path}" lib/arm64-v8a/libOsmAndCoreWithJNI.so > "${RUNNER_TEMP}/packaged-OsmAndCoreWithJNI.so"
          test -s "${RUNNER_TEMP}/packaged-OsmAndCoreWithJNI.so"
          cmp binaries/android/clang-arm64-v8a/Debug/libOsmAndCoreWithJNI.so "${RUNNER_TEMP}/packaged-OsmAndCoreWithJNI.so"

      - name: Publish Gradle failure details
        if: failure()
        run: |
          if [ ! -f "${RUNNER_TEMP}/gradle-build.log" ]; then
            exit 0
          fi
          grep -nE '(^e: |error: |FAILURE:|What went wrong|Compilation error|Unresolved reference|Type mismatch|Cannot access|None of the following)' "${RUNNER_TEMP}/gradle-build.log" > "${RUNNER_TEMP}/gradle-errors.log" || true
          {
            echo "### Gradle build failure"
            echo '```text'
            tail -n 160 "${RUNNER_TEMP}/gradle-errors.log"
            echo
            tail -n 40 "${RUNNER_TEMP}/gradle-build.log"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          failure_context="$(awk '/FAILURE: Build failed with an exception/{capture=1} capture{print}' "${RUNNER_TEMP}/gradle-build.log" | tail -n 140)"
          details="$(tail -n 160 "${RUNNER_TEMP}/gradle-errors.log")"
          if [ -n "${failure_context}" ]; then
            details="$(printf '%s\n\n%s' "${details}" "${failure_context}")"
          fi
          if [ -z "${details}" ]; then
            details="$(tail -n 140 "${RUNNER_TEMP}/gradle-build.log")"
          fi
          details="${details//'%'/'%25'}"
          details="${details//$'\r'/'%0D'}"
          details="${details//$'\n'/'%0A'}"
          echo "::error title=Gradle build failed::${details}"

      - name: Show remaining disk space
        if: always()
        run: df -h

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: osmand-smart-android-full-opengl-arm64-debug
          path: android/OsmAnd/build/outputs/apk/**/*.apk
          if-no-files-found: error
          # This artifact is only the hand-off to the release workflow. The public
          # release asset remains downloadable independently of this retention.
          retention-days: 1
